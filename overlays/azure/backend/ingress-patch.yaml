apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  rules:
  - host: api.20.196.224.90.nip.io 
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: solog-backend-service
            port:
              number: 8080