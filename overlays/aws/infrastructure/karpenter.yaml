apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: public.ecr.aws/karpenter
    targetRevision: 1.0.1
    chart: karpenter
    helm:
      releaseName: karpenter
      values: |
        serviceAccount:
          create: true
          name: karpenter
          annotations:
            eks.amazonaws.com/role-arn: "arn:aws:iam::215572961831:role/KarpenterController-2026022802402199560000001a"
        
        settings:
          clusterName: "gitops-cluster" 
          interruptionQueue: "gitops-cluster-karpenter-queue"
          
        controller:
          resources:
            requests:
              cpu: 1
              memory: 1Gi
            limits:
              cpu: 1
              memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true