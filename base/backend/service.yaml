apiVersion: v1
kind: Service
metadata:
  name: solog-backend
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-port: '8080'
spec:
  type: ClusterIP
  selector:
    app: solog-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080