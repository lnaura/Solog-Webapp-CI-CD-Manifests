apiVersion: apps/v1
kind: Deployment
metadata:
  name: solog-backend
  namespace: default
  labels:
    app: solog-backend
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: solog-backend
  template:
    metadata:
      labels:
        app: solog-backend
    spec:
      containers:
        - name: solog-backend
          image: solog-backend
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: OPENAI_API_KEY
            - name: OPENAI_API_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: OPENAI_API_URL
            - name: GRAFANA_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: GRAFANA_URL
            - name: GRAFANA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: GRAFANA_TOKEN
            
            - name: MANAGEMENT_HEALTH_DEFAULTS_ENABLED
              value: "false"
            - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
              value: "never"

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
          
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Gi"
              cpu: "500m"