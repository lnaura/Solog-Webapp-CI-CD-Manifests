# infrastructure/karpenter-config.yaml
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2
  # Terraform에서 만든 KarpenterNodeRole 이름과 일치해야 함
  role: "KarpenterNodeRole-gitops-cluster"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "gitops-cluster"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "gitops-cluster"
---
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot", "on-demand"] # 비용 효율을 위해 Spot 우선 사용 권장
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        - key: "karpenter.k8s.aws/instance-category"
          operator: In
          values: ["c", "m", "r"]
      nodeClassRef:
        name: default
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 720h