apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: solog-frontend      
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io 
spec:
  project: default
  source:
    repoURL: https://github.com/lnaura/Solog-Webapp-CI-CD-Manifests.git 
    targetRevision: HEAD
    path: frontend          
  destination:
    server: https://kubernetes.default.svc
    namespace: default     
  syncPolicy:
    automated:
      prune: true    
      selfHeal: true   
    syncOptions:
      - CreateNamespace=true